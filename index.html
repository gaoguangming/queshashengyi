<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>缺啥生意 · 按省进入的选址候选点位 + 财务测算演示</title>
<!-- Leaflet（开源地图库，走 CDN；底图 OpenStreetMap，均不需要 API Key） -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{
    --blue:#2563eb; --blue-dark:#1d4ed8; --blue-soft:#eff5ff; --bg:#f4f6fb;
    --card:#ffffff; --line:#e6eaf2; --text:#1f2937; --muted:#6b7280;
    --green:#22c55e; --orange:#f59e0b; --red:#ef4444;
    --green-bg:#ecfdf3; --orange-bg:#fff8eb; --red-bg:#fef2f2;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;}
  .wrap{width:100%;max-width:600px;margin:0 auto;padding:20px 14px 24px;}
  header{text-align:center;padding:10px 0 16px;}
  .logo{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;background:var(--blue);color:#fff;font-size:17px;font-weight:700;vertical-align:-9px;margin-right:8px;}
  h1.top{display:inline-block;margin:0;font-size:21px;font-weight:700;letter-spacing:.5px;}
  .sub{margin:6px 0 0;color:var(--muted);font-size:13.5px;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 16px;margin-bottom:16px;box-shadow:0 1px 2px rgba(16,24,40,.04),0 6px 18px rgba(16,24,40,.04);}
  .card h2{margin:0 0 14px;font-size:15px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:8px;}
  .bar{width:3px;height:15px;border-radius:2px;background:var(--blue);display:inline-block;}
  label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px;}
  .field{margin-bottom:14px;}
  input,select{width:100%;padding:11px 12px;font-size:15px;color:var(--text);background:#fff;border:1px solid #d6dce8;border-radius:10px;outline:none;font-family:inherit;appearance:none;}
  select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' stroke='%236b7280' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");background-repeat:no-repeat;background-position:right 12px center;padding-right:34px;}
  input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12);}
  .err{color:var(--red);font-size:13px;margin:8px 0 0;display:none;} .err.on{display:block;}
  .hint{font-size:12px;color:#9aa3b2;line-height:1.6;background:#f6f9ff;border:1px solid #dce8fc;border-radius:8px;padding:8px 10px;margin:0 0 14px;}
  button.go{width:100%;padding:13px;font-size:16px;font-weight:600;color:#fff;background:var(--blue);border:none;border-radius:10px;cursor:pointer;font-family:inherit;transition:background .15s;}
  button.go:hover{background:var(--blue-dark);} button.go:active{transform:translateY(1px);} button.go:disabled{background:#9db6ea;cursor:not-allowed;}
  .loading{display:none;text-align:center;padding:26px 0;color:var(--muted);font-size:14px;} .loading.on{display:block;}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--blue);margin-right:4px;animation:bl 1s infinite;}
  .dot:nth-child(2){animation-delay:.18s;} .dot:nth-child(3){animation-delay:.36s;}
  @keyframes bl{0%,100%{opacity:.25;}50%{opacity:1;}}

  .foot-bottom{text-align:center;font-size:13px;color:#5b6472;line-height:1.6;padding:18px 14px calc(22px + env(safe-area-inset-bottom,0px));max-width:600px;margin:0 auto;}
  .foot-bottom b{color:var(--blue-dark);} .foot-bottom .fb-sub{display:block;font-size:12px;color:#9aa3b2;margin-top:4px;}

  /* ---------- 地图舞台（查看候选点位后显示） ---------- */
  #mapStage{display:none;margin-bottom:16px;}
  #mapStage.on{display:block;animation:fade .28s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .map-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);margin:0 2px 8px;}
  .map-head b{color:#374151;} .map-head button{font-size:13px;color:var(--blue);background:none;border:none;cursor:pointer;padding:4px 6px;}
  .poi-map{width:100%;height:380px;border-radius:12px;overflow:hidden;border:1px solid var(--line);box-shadow:0 1px 2px rgba(16,24,40,.04),0 4px 14px rgba(16,24,40,.05);background:#eef1f6;position:relative;}
  .map-note{position:absolute;left:8px;bottom:8px;z-index:500;font-size:11px;color:#6b7280;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:8px;padding:4px 8px;}
  .tile-notice{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:500;width:min(280px,82%);text-align:center;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:12px;line-height:1.6;color:var(--muted);box-shadow:0 4px 14px rgba(16,24,40,.08);}
  .tile-notice b{color:var(--text);font-size:13px;}
  .spot-label{background:#fff;border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:11px;color:#374151;box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .leaflet-popup-content-wrapper{border-radius:10px;}

  /* 点位信息卡（底部上滑） */
  .spot-card{display:none;background:#fff;border:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:0 -6px 20px rgba(16,24,40,.12);padding:14px 16px 18px;margin-top:-14px;position:relative;z-index:600;}
  .spot-card.on{display:block;}
  .sc-head{font-size:16px;font-weight:700;color:#111827;display:flex;align-items:center;gap:8px;}
  .sc-tag{font-size:11px;font-weight:600;color:#fff;background:var(--blue);border-radius:999px;padding:2px 9px;}
  .sc-judge{font-size:13px;color:#4b5563;line-height:1.7;margin:6px 0 10px;}
  .sc-bar{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px;}
  .sc-bar .lab{width:64px;flex:0 0 64px;color:#6b7280;text-align:right;}
  .sc-track{flex:1;height:10px;background:#eef1f6;border-radius:999px;overflow:hidden;}
  .sc-fill{height:100%;border-radius:999px;}
  .sc-val{width:40px;flex:0 0 40px;font-weight:700;}
  .sc-meta{font-size:12.5px;color:#6b7280;margin:8px 0;display:flex;flex-wrap:wrap;gap:4px 14px;}
  .sc-meta b{color:#374151;}
  .sc-acts{display:flex;gap:10px;margin-top:10px;}
  .sc-acts button{flex:1;min-height:44px;border:none;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;}
  .btn-fin{background:var(--blue);color:#fff;} .btn-fin:hover{background:var(--blue-dark);}
  .btn-rep{background:#f1f3f8;color:var(--muted);}

  /* ---------- 财务测算面板（右侧滑入 / 移动端底部上滑） ---------- */
  #finPanel{position:fixed;top:0;right:0;height:100%;width:380px;max-width:92vw;background:#fff;box-shadow:-8px 0 30px rgba(16,24,40,.18);transform:translateX(100%);transition:transform .28s ease;z-index:1200;display:flex;flex-direction:column;}
  #finPanel.on{transform:translateX(0);}
  .fin-top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);}
  .fin-top b{font-size:15px;color:#111827;} .fin-top .x{background:none;border:none;font-size:22px;color:#9aa3b2;cursor:pointer;line-height:1;}
  .fin-body{padding:14px 16px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch;}
  .fin-note{font-size:11.5px;color:#9aa3b2;background:#f7f8fa;border:1px dashed #e3e7ee;border-radius:8px;padding:7px 9px;margin-bottom:12px;line-height:1.5;}
  .fin-sec-t{font-size:13px;font-weight:700;color:#374151;margin:14px 0 8px;}
  .slider{margin-bottom:12px;}
  .slider .sl-top{display:flex;justify-content:space-between;font-size:13px;color:#4b5563;margin-bottom:4px;}
  .slider .sl-top b{color:var(--blue-dark);}
  .slider input[type=range]{width:100%;accent-color:var(--blue);}
  .fin-res{background:#f6f9ff;border:1px solid #dce8fc;border-radius:10px;padding:12px;margin-top:8px;}
  .fin-res .r1{display:flex;justify-content:space-between;font-size:13.5px;padding:4px 0;border-bottom:1px dashed var(--line);}
  .fin-res .r1:last-child{border-bottom:none;}
  .fin-res .r1 b{color:#111827;}
  .fin-res .hl{color:var(--blue-dark);font-weight:700;}
  .scene-row{display:flex;gap:8px;margin-top:10px;}
  .scene{flex:1;border:1px solid var(--line);border-radius:9px;padding:8px;text-align:center;font-size:12px;}
  .scene .sn{color:#6b7280;} .scene .sp{font-weight:700;color:#111827;font-size:13px;margin-top:2px;}
  .scene.ok{border-color:#bbf7d0;background:var(--green-bg);} .scene.bad{border-color:#fecaca;background:var(--red-bg);}
  .cmp-head{display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
  .cmp-head b{font-size:13px;color:#374151;} .cmp-head button{font-size:12px;color:var(--blue);background:none;border:none;cursor:pointer;}
  .cmp-cards{display:flex;gap:8px;margin-top:8px;}
  .cmp-card{flex:1;border:1px solid var(--line);border-radius:9px;padding:8px;font-size:11.5px;min-width:0;}
  .cmp-card .cn{font-weight:700;color:#111827;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cmp-card .cv{color:#4b5563;margin-top:3px;}

  /* ---------- 报告区 ---------- */
  #result{width:100%;max-width:840px;margin:0 auto;padding:0 14px 40px;display:none;}
  #result.on{display:block;}
  .report-doc{max-width:800px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px 26px 30px;box-shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.05);color:#1f2937;}
  .rep-meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12.5px;color:var(--muted);padding:9px 12px;background:#f6f9ff;border:1px solid #dce8fc;border-radius:10px;margin-bottom:18px;}
  .rep-meta b{color:#374151;font-weight:600;}
  .rep-cover{text-align:center;padding:14px 8px 20px;border-bottom:2px solid var(--blue);margin-bottom:18px;}
  .rep-cover-kicker{font-size:12px;letter-spacing:2px;color:var(--blue);font-weight:600;margin-bottom:10px;}
  .rep-title{font-size:20px;font-weight:700;line-height:1.45;margin:0 0 12px;color:#111827;}
  .rep-cover-meta{font-size:13px;color:#4b5563;line-height:1.8;}
  .rep-cover-disclaimer{margin-top:12px;font-size:11.5px;color:#9aa3b2;line-height:1.6;background:#f7f8fa;border:1px dashed #e3e7ee;border-radius:8px;padding:8px 10px;}
  h2.rep-sec{font-size:17px;font-weight:700;color:#111827;margin:26px 0 12px;padding-left:11px;border-left:4px solid var(--blue);line-height:1.4;}
  h3.rep-h3{font-size:14.5px;font-weight:600;color:#374151;margin:16px 0 8px;}
  .rep-p{font-size:14px;line-height:1.8;color:#374151;margin:8px 0;} .rep-p b{color:#111827;}
  .verdict{display:inline-block;font-size:15px;font-weight:700;padding:6px 16px;border-radius:999px;margin-bottom:4px;}
  .v-go{color:#15803d;background:var(--green-bg);border:1px solid #bbf7d0;}
  .v-watch{color:#b45309;background:var(--orange-bg);border:1px solid #fde9c8;}
  .v-no{color:#b91c1c;background:var(--red-bg);border:1px solid #fecaca;}
  .rep-bars{margin:14px 0 6px;}
  .rep-bar-row{display:flex;align-items:center;gap:12px;margin:10px 0;}
  .rep-bar-label{width:78px;flex:0 0 78px;font-size:13px;color:#4b5563;text-align:right;}
  .rep-bar-track{flex:1;height:12px;background:#eef1f6;border-radius:999px;overflow:hidden;}
  .rep-bar-fill{height:100%;border-radius:999px;}
  .rep-bar-val{width:54px;flex:0 0 54px;font-size:13px;font-weight:700;text-align:left;}
  .rep-list{margin:8px 0;padding-left:0;list-style:none;}
  .rep-list li{position:relative;padding:7px 0 7px 22px;font-size:14px;line-height:1.75;color:#374151;border-bottom:1px dashed var(--line);}
  .rep-list li:last-child{border-bottom:none;}
  .rep-list li::before{content:'·';position:absolute;left:6px;top:6px;color:var(--blue);font-weight:700;font-size:16px;}
  .rep-list li b{color:#111827;}
  ol.rep-list li::before{content:'';}
  .rep-callout{background:#f6f9ff;border:1px solid #d6e4fc;border-left:3px solid var(--blue);border-radius:8px;padding:10px 13px;font-size:13.5px;line-height:1.7;color:#374151;margin:10px 0;}
  .rep-risk{background:var(--red-bg);border:1px solid #fecaca;border-radius:8px;padding:8px 12px;font-size:13.5px;line-height:1.7;color:#7f1d1d;margin:6px 0;} .rep-risk b{color:#b91c1c;}
  .rep-tip{background:var(--green-bg);border:1px solid #bbf7d0;border-radius:8px;padding:10px 13px;font-size:14px;line-height:1.7;color:#166534;margin:10px 0;}
  .rep-table{width:100%;border-collapse:collapse;font-size:14px;margin:10px 0 4px;display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .rep-table th,.rep-table td{border:1px solid #e6eaf2;padding:8px 10px;text-align:left;line-height:1.5;}
  .rep-table th{background:#f4f6fb;color:#374151;font-weight:600;}
  .rep-table tbody tr:nth-child(even){background:#fafbfe;}
  .rep-table td.num{text-align:right;font-variant-numeric:tabular-nums;}
  .rep-table .hl{color:var(--blue-dark);font-weight:600;}
  .area-card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0;background:#fcfdff;}
  .area-card .a-name{font-size:14px;font-weight:700;color:#111827;margin:0 0 4px;}
  .area-card .a-coord{font-size:12px;color:#9aa3b2;margin:0 0 6px;}
  .area-card .a-verdict{font-size:13px;color:#374151;line-height:1.7;margin:0;}
  .area-card .a-shops{font-size:12.5px;color:#6b7280;margin:6px 0 0;}
  .poi-legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin:10px 0 0;font-size:12px;color:var(--muted);}
  .poi-legend span{display:inline-flex;align-items:center;gap:5px;} .poi-legend i{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .poi-caption{font-size:11.5px;color:#9aa3b2;margin:8px 0 0;line-height:1.6;}
  .report-acts{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}
  .btn{min-height:44px;padding:0 18px;border:none;border-radius:8px;font-family:inherit;font-size:14px;font-weight:600;color:#fff;background:var(--blue);cursor:pointer;white-space:nowrap;transition:background .15s;}
  .btn:hover{background:var(--blue-dark);} .btn.ghost{background:#f1f3f8;color:var(--muted);font-weight:500;}
  .regen{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:14px 16px;font-size:14px;line-height:1.7;color:#7c2d12;max-width:800px;margin:0 auto;}
  .regen b{color:#b45309;}
  .rep-appendix{font-size:13px;color:#4b5563;line-height:1.8;} .rep-appendix h3{font-size:14px;color:#111827;margin:14px 0 6px;}

  /* ---------- PRINT_STYLE ---------- */
  @media print{
    .no-print{display:none !important;}
    body{background:#fff;}
    .wrap{max-width:none;padding:0 !important;}
    #result{max-width:none;padding:0 !important;display:block !important;}
    .report-doc{max-width:none;width:100%;border:none !important;box-shadow:none !important;padding:0 !important;margin:0 !important;}
    .rep-cover-disclaimer,.rep-meta{box-shadow:none;}
    .rep-meta{background:#fff !important;border:1px solid #ccc !important;}
    .poi-map{height:300px !important;box-shadow:none !important;border:1px solid #ccc !important;}
    .tile-notice{display:none !important;}
    .report-acts{display:none !important;}
    .btn.print{display:none !important;}
    .rep-cover{border-bottom:2px solid #000 !important;}
    h2.rep-sec{border-left:4px solid #000 !important;}
    a{color:#000 !important;}
  }
  @media (max-width:520px){ .report-doc{padding:18px 14px 24px;} .rep-title{font-size:17px;} .rep-bar-label{width:64px;flex-basis:64px;font-size:12px;} }
  @media (max-width:680px){
    #finPanel{top:auto;bottom:0;left:0;height:88vh;width:100%;max-width:100%;transform:translateY(100%);border-radius:14px 14px 0 0;box-shadow:0 -8px 30px rgba(16,24,40,.18);}
    #finPanel.on{transform:translateY(0);}
  }
</style>
</head>
<body>

<!-- ============ 选择区（省→市→区县→业态 下钻） ============ -->
<div class="wrap">
  <header>
    <h1 class="top"><span class="logo">缺</span>缺啥生意</h1>
    <p class="sub">按省进入 · 候选点位地图 + 财务测算（演示版）</p>
  </header>

  <div class="card no-print">
    <h2><span class="bar"></span>选择省份 / 城市 / 区县 / 业态</h2>
    <div class="field"><label for="province">省份</label>
      <select id="province"><option value="">请选择省份</option><option value="北京">北京（直辖市）</option><option value="山西">山西</option><option value="江苏">江苏</option></select></div>
    <div class="field"><label for="city">城市 / 城区</label>
      <select id="city"><option value="">请先选择省份</option></select></div>
    <div class="field"><label for="district">区县 / 商圈（可选）</label>
      <select id="district"><option value="">不限定（默认首选项）</option></select></div>
    <div class="field"><label for="biz">关注业态</label>
      <select id="biz">
        <option value="餐饮零售">餐饮零售（深度测算）</option>
        <option value="教培托管">教培托管（深度测算）</option>
        <option value="生活服务">生活服务·美业/健身/护理（深度测算）</option>
        <option value="社区便民">社区便民/托管混合（深度测算）</option>
        <option value="便利店/茶饮快餐">便利店/茶饮快餐（深度测算）</option>
        <option value="其他">其他长尾业态（通用测算）</option>
      </select></div>
    <p class="hint">省份和城市用于筛选范围，实际分析细化到街道/商圈级别。演示版预设代表性街道，正式版将接入高德数据覆盖全部街道/路段/门牌。</p>
    <button class="go" id="go">查看候选点位</button>
    <p class="err" id="errCity">请先选择省份与城市。</p>
  </div>

  <div class="loading" id="loading"><span class="dot"></span><span class="dot"></span><span class="dot"></span> 正在生成候选点位……</div>

  <!-- ============ 地图舞台 ============ -->
  <div id="mapStage">
    <div class="map-head"><span>当前：<b id="msScope">—</b></span><button id="backSel">重新选择</button></div>
    <div id="poiMap" class="poi-map">
      <div class="map-note">演示 · 非实时 · 示意点位 · 正式版接入高德后将细化到路段/门牌级</div>
    </div>
    <div class="spot-card" id="spotCard"></div>
  </div>
</div>

<!-- ============ 报告区（REPORT_TEMPLATE 渲染目标，id=report 锚点） ============ -->
<div id="result"></div>

<!-- ============ 财务测算面板（侧滑） ============ -->
<div id="finPanel">
  <div class="fin-top"><b id="finTitle">财务测算</b><button class="x" id="finClose">×</button></div>
  <div class="fin-body" id="finBody"></div>
</div>

<!-- ============ 底部引导（无留资、无弹窗） ============ -->
<div class="foot-bottom no-print">
  <b>正式版小程序即将上线 · 真实数据（高德POI）· 按次1元起 · 7天卡9.9元</b>
  <span class="fb-sub">演示版免费开放：省份/城市/区县选择 · 地图圆圈+基础评分 · 每点位信息卡</span>
</div>

<!-- Leaflet 主库（开源，走 CDN；底图 OpenStreetMap，不需要任何 API Key） -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* =========================================================
   GAODE_MIGRATION_NOTES：高德接入预留说明（第 12 章，8 条）
   正式版接入高德开放平台后：
   1. 行政区划API：DISTRICT_STREET_MAP 替换为高德行政区划API返回的真实街道边界

     餐饮：扎堆聚人气但同质化内卷，看价格带重叠度与翻台差异
     教培：不怕扎堆怕没同行，无同行=需求未验证
     零售：品类差异化 + 租金承受力
     生活服务：便利性驱动，500m 竞品少=机会
     健康理疗：重信任复购，借互补业态稳定客源
     宠物：客单高复购强，有社区即有机会
   ========================================================= */
function COMPETITION_ENGINE(industry, cats){
  const KEYMAP = { '餐饮零售':'餐饮','便利店/茶饮快餐':'餐饮','生活服务':'生活服务','社区便民':'生活服务','教培托管':'教培','其他':'其他' };
  const tKey = KEYMAP[industry] || '其他';
  const order = ['餐饮','教培','零售','生活服务','健康理疗','宠物'];
  const counts = order.map(function(k){ return { key:k, label:CATS_KEY_LABEL[k]||k, count:(cats[k]||0) }; });
  const peerTotal = counts.reduce(function(a,c){ return a+c.count; }, 0);
  const targetPeers = cats[tKey] || 0;
  const concentration = peerTotal>0 ? Math.round(targetPeers/peerTotal*100) : 0;
  const blankCats = counts.filter(function(c){ return c.count===0; }).map(function(c){ return c.label; });
  const complement = peerTotal - targetPeers;
  let concLabel, label, advice;
  if(targetPeers===0){
    concLabel='低'; label='该品类空白，可能是进入机会（但需验证需求）';
    advice='周边 500m 无同业态门店，空白意味着先发优势，但也可能需求未被验证。建议先用轻资产/快闪试水，配合实地问卷确认真实客流与消费习惯。';
  } else if(concentration>60){
    concLabel='高'; label='同质化严重，建议差异化切入';
    advice='同业态占周边门店 60% 以上，红海竞争、价格战概率大。须用差异化品类 + 错位时段 + 私域锁客切入，避免正面价格内卷。';
  } else if(concentration>=30){
    concLabel='中'; label='品类分散，可借聚人气红利';
    advice='业态分布较均衡，周边人流已被多种业态培育。可借人气红利进入，选互补空档品类，与现有业态形成协同而非直接竞争。';
  } else {
    concLabel='低'; label='品类空白，需验证需求';
    advice='同业态占比低（<30%），需求尚未被充分满足或验证。建议小步试错 + 实地访谈，确认消费习惯后再加重投入。';
  }
  if(industry==='餐饮'){
    if(targetPeers>0) advice += '（餐饮模型：扎堆可聚人气，但同质化易内卷——重点看价格带重叠度与翻台率差异，用招牌品/时段错位拉开。）';
  } else if(industry==='教培托管'){
    if(targetPeers===0){ label='无同行扎堆，但教培"怕没同行"——需求可能未被市场验证'; advice='教培不怕同行扎堆，反而有同行说明需求已被验证、家长认知成熟。当前无同行，须重点核验周边学校/小区密度与付费意愿，再决定是否进入。'; }
    else { advice += '（教培模型：有同行=需求被验证，重点看直接竞品数、互补业态与周边学校/小区密度，用师资/成果差异化。）'; }
  } else if(industry==='零售'){
    advice += '（零售模型：关键在品类差异化 + 租金承受力，避免与连锁贴身价格战，做精选/体验型品类。）';
  } else if(industry==='生活服务'){
    if(targetPeers<=6){ advice = '周边 500m 同业态门店少（'+targetPeers+' 家），生活服务由便利性驱动，空白即机会。'+(blankCats.length?('空白品类：'+blankCats.join('、')+'。'):''); }
    else { advice += '（生活服务模型：便利性驱动，500m 竞品少=机会，多则拼地段与会员复购。）'; }
  } else if(industry==='健康理疗'){
    advice += '（健康理疗模型：重信任与复购，周边互补业态（社区/产业）带来稳定客源，避免与连锁正面对撞。）';
  } else if(industry==='宠物'){
    advice += '（宠物模型：客单高、复购强，周边有社区/住宅即有机会，可叠加寄养/美容提高频次。）';
  }
  return { peerTotal:peerTotal, counts:counts, targetPeers:targetPeers, concentration:concentration,
           concLabel:concLabel, blankCats:blankCats, complement:complement, label:label, advice:advice };
}

/* =========================================================
   工具
   ========================================================= */
function hash(str){ let h=2166136261; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); } return Math.abs(h); }
function rnd(seed){ const x=Math.sin(seed%1000)*10000; return x-Math.floor(x); }
function clamp(v,lo,hi){ return Math.max(lo,Math.min(hi,v)); }
function fmtMoney(n){ return (typeof n==='number' && isFinite(n)) ? Math.round(n).toLocaleString('zh-CN') : '待输入'; }
/* 全局防 NaN/undefined/Infinity：非有限数统一回退（演示预设/待输入/不影响演示） */
function num(x, fb){ return (typeof x==='number' && isFinite(x)) ? x : (fb===undefined?0:fb); }
function pct(x){ return (typeof x==='number' && isFinite(x)) ? Math.round(x)+'%' : '待输入'; }
function getCityData(city){ return CITIES[city] || CITIES['北京']; }
function getBaseCenter(city, district){
  let base = CITY_CENTER_MAP[city];
  if(!base) base = CITY_CENTER_MAP['北京'];
  const offKey = district || (CITY_CENTER_MAP[city] ? null : city);
  const off = DISTRICT_OFFSETS[offKey] || [0,0];
  return [ +(base[0]+off[0]).toFixed(6), +(base[1]+off[1]).toFixed(6) ];
}

/* 取某区县下的街道/商圈列表（示例，含面积/租金单价） */
function getStreets(district, city){
  const key = district || city;
  if(DISTRICT_STREET_MAP[key]) return DISTRICT_STREET_MAP[key];
  // 通用生成 3 个代表性街道（按标签取面积/单价）
  const pick = [
    { tag:'核心商业', off:[0.010,0.008], desc:'区域核心商业带，客流集中（示例）' },
    { tag:'居住社区', off:[-0.008,0.010], desc:'周边常住社区，复购稳定（示例）' },
    { tag:'产业片区', off:[0.012,-0.010], desc:'产业或学校辐射，时段集中（示例）' }
  ];
  return pick.map(function(p){ const tp=TAG_PRESETS[p.tag]; return { name:(district||city)+'核心商圈', tag:p.tag, off:p.off, area:tp.area, rentUnit:tp.rentUnit, rentRange:tp.rentRange, desc:p.desc }; });
}

/* 由街道/商圈生成单个点位数据（坐标 + 评分 + 财务预设，面积联动租金） */
function buildSpot(province, city, district, bizProduct, street, idx){
  const fmtKey = PRODUCT_TO_FMT[bizProduct] || '其他';
  const cd = getCityData(city);
  const base = getBaseCenter(city, district);
  const seed = hash([province,city,district,fmtKey,street.name].join('|'));
  const tp = TAG_PRESETS[street.tag] || TAG_PRESETS['居住社区'];

  const supply = clamp(Math.round(55 + cd.bias*0.5 + tp.supply + (rnd(seed+11)-0.5)*10), 28, 90);
  const pressure = clamp(Math.round(45 + cd.density*10 + tp.pressure + (rnd(seed+17)-0.5)*10), 28, 90);
  const fit = clamp(Math.round(50 + (5-cd.rentLevel)*3 + tp.fit + (rnd(seed+23)-0.5)*10), 28, 90);
  const composite = SCORING_MODEL.composite(supply, pressure, fit);
  const verdict = SCORING_MODEL.verdict(composite);

  // 面积联动租金
  const area = street.area || tp.area || 80;
  const rentUnit = street.rentUnit || tp.rentUnit || 100;
  const rentRange = street.rentRange || tp.rentRange || [60,120];
  const rent = Math.round(area * rentUnit);
  const ticket = Math.round(FIN_BASE.ticket[fmtKey] * tp.ticketMul);
  const traffic = Math.round(FIN_BASE.traffic[fmtKey] * tp.trafficMul);
  const staff = FIN_BASE.staff[fmtKey], wage = FIN_BASE.wage[fmtKey];
  const fitout = FIN_BASE.fitout[fmtKey], equip = FIN_BASE.equip[fmtKey];
  const fitoutMonthly = Math.round((fitout + equip) / 24);
  const util = Math.round(rent*0.15 + 800);
  const model = (BIZ_MODELS[bizProduct] && BIZ_MODELS[bizProduct].group) || 'trade';
  const md = MODEL_DEFAULTS[model] || MODEL_DEFAULTS.trade;
  const finPreset = Object.assign(
    { area:area, rentUnit:rentUnit, rentRange:rentRange, rent:rent, model:model,
      fitoutMonthly:fitoutMonthly, staff:staff, wage:wage, costPct:tp.costPct, util:util,
      platformPct:tp.platformPct, ticket:ticket, traffic:traffic, fitout:fitout, equip:equip }, md);

  const coord = [ +(base[0]+street.off[0]).toFixed(6), +(base[1]+street.off[1]).toFixed(6) ];
  // 竞争差异化引擎：品类分布 + 所选业态 → 集中度/空白/互补
  const cats = street.cats || CATS_BY_TAG[street.tag] || CATS_BY_TAG['居住社区'];
  const comp = COMPETITION_ENGINE(bizProduct, cats);
  return { name:street.name, tag:street.tag, desc:street.desc, coord:coord, audience:tp.audience, rentNote:tp.rentNote,
           area:area, rentUnit:rentUnit, rentRange:rentRange, rent:rent, cats:cats, comp:comp,
           scores:{ supply:supply, pressure:pressure, fit:fit, composite:composite, verdict:verdict }, finPreset:finPreset };
}

/* 财务测算（输入预设 → 结果） */
/* =========================================================
   FINANCIAL_MODEL 计算：按业态模型分派（trade/edu/service/community/generic）
   统一输出：labor/monthlyFixed/margin/breakEvenRev/initial/scenes/breakEvenTraffic/dayNeed
   + extras（模型专属：保本学员数/满班率/会员占比/预约率/人效/分模块）
   + breakEvenUnit{label,value}（按业态给出正确的"保本单位"）
   全程 num() 防护，绝不出现 NaN/undefined/Infinity
   ========================================================= */
function computeFin(p){
  const model = p.model || 'trade';
  const labor = num(p.staff,0) * num(p.wage,0);
  const monthlyFixed = num(p.rent,0) + labor + num(p.fitoutMonthly,0) + num(p.util,0);
  const costPct = num(p.costPct,40), platPct = num(p.platformPct,0);
  const margin = clamp(1 - costPct/100 - platPct/100*0.3, 0.05, 0.9);
  const ticket = num(p.ticket,30);
  const breakEvenRev = margin>0 ? Math.round(monthlyFixed/margin) : 0;
  const initial = Math.round(num(p.rent,0)*2 + num(p.fitout,0) + num(p.equip,0));
  const baseTraffic = num(p.traffic,20);
  const scenes = [ {name:'保守',k:0.6},{name:'基准',k:1.0},{name:'乐观',k:1.4} ].map(function(s){
    const tr = Math.round(baseTraffic * s.k);
    const rev = Math.round(tr * 30 * ticket);
    const profit = Math.round(rev * margin - monthlyFixed);
    const payback = profit>0 ? (initial/profit).toFixed(1)+' 个月' : '模型不成立';
    return { name:s.name, traffic:tr, rev:rev, profit:profit, payback:payback };
  });
  const baseScene = scenes[1];
  const breakEvenTraffic = (ticket>0 && baseScene.traffic>0) ? Math.round(breakEvenRev/(ticket*30)) : 0;
  const fin = { model:model, labor:labor, monthlyFixed:monthlyFixed, margin:margin, breakEvenRev:breakEvenRev,
    initial:initial, ticket:ticket, costPct:costPct, platPct:platPct, scenes:scenes,
    breakEvenTraffic:breakEvenTraffic, dailyNeed:breakEvenTraffic, extras:{},
    staff:num(p.staff,0), wage:num(p.wage,0), fitoutMonthly:num(p.fitoutMonthly,0), util:num(p.util,0) };
  if(model==='edu'){
    const freq = num(p.freq,8), students = num(p.students,40), fullRate = num(p.fullRate,70), renewPct = num(p.renewPct,60);
    const breakEvenStudents = (ticket*freq>0) ? Math.ceil(breakEvenRev/(ticket*freq)) : 0;
    fin.extras = { students:students, fullRate:fullRate, renewPct:renewPct, freq:freq,
      breakEvenStudents:breakEvenStudents, monthRev:Math.round(students*freq*ticket),
      seatCap:Math.max(1, Math.round(students/Math.max(1,fullRate/100))) };
    fin.breakEvenUnit = { label:'保本学员数', value:breakEvenStudents+' 人' };
  } else if(model==='service'){
    const memberPct = num(p.memberPct,40), bookRate = num(p.bookRate,60);
    const wageTot = num(p.staff,1)*num(p.wage,5000);
    fin.extras = { memberPct:memberPct, bookRate:bookRate,
      manEff: wageTot>0 ? Math.round((baseTraffic*30*ticket*margin)/wageTot) : 0 };
    fin.breakEvenUnit = { label:'保本客次/月', value:(baseTraffic*30)+' 次' };
  } else if(model==='community'){
    fin.extras = { modules:[ {name:'托管/便民',pct:40}, {name:'轻零售',pct:35}, {name:'活动/健康',pct:25} ] };
    fin.breakEvenUnit = { label:'保本服务人次/月', value:(baseTraffic*30)+' 人次' };
  } else if(model==='generic'){
    fin.breakEvenUnit = { label:'保本单量/月', value:(baseTraffic*30)+' 单' };
  } else {
    fin.breakEvenUnit = { label:'保本单量/月', value:(baseTraffic*30)+' 单' };
  }
  return fin;
}

/* =========================================================
   SENSITIVITY_ANALYSIS：租金±20% / 客单价±15% / 单量±30% + 死亡区间
   + 模型专属轴（教培：在册/续费率；生活服务：预约率/会员占比；社区便民：服务人次）
   全程 num() 防护
   ========================================================= */
function sensAnalysis(p){
  const base = computeFin(p);
  const baseScene = base.scenes[1];
  const baseProfit = baseScene.profit;
  const rentUp = computeFin(Object.assign({},p,{rent:Math.round(num(p.rent)*1.2)}));
  const rentDown = computeFin(Object.assign({},p,{rent:Math.round(num(p.rent)*0.8)}));
  const revUp = computeFin(Object.assign({},p,{ticket:Math.round(num(p.ticket)*1.15)}));
  const revDown = computeFin(Object.assign({},p,{ticket:Math.round(num(p.ticket)*0.85)}));
  const trUp = computeFin(Object.assign({},p,{traffic:Math.round(num(p.traffic)*1.3)}));
  const trDown = computeFin(Object.assign({},p,{traffic:Math.round(num(p.traffic)*0.7)}));
  const deathFin = computeFin(Object.assign({},p,{rent:Math.round(num(p.rent)*1.2), ticket:Math.round(num(p.ticket)*0.85)}));
  const deathProfit = deathFin.scenes[1].profit;
  const modelRows = [];
  if(p.model==='edu'){
    const fs = computeFin(Object.assign({},p,{students:Math.max(1,Math.round(num(p.students)*0.7))}));
    modelRows.push({label:'在册学员 -30%', impact:'月净利', value:fmtMoney(fs.scenes[1].profit)+' 元'});
    const rp = computeFin(Object.assign({},p,{renewPct:Math.max(0,Math.round(num(p.renewPct)*0.7))}));
    modelRows.push({label:'续费率 -30%', impact:'月净利', value:fmtMoney(rp.scenes[1].profit)+' 元'});
  } else if(p.model==='service'){
    const br = computeFin(Object.assign({},p,{bookRate:Math.max(0,Math.round(num(p.bookRate)*0.7))}));
    modelRows.push({label:'预约率 -30%', impact:'月净利', value:fmtMoney(br.scenes[1].profit)+' 元'});
    const mp = computeFin(Object.assign({},p,{memberPct:Math.max(0,Math.round(num(p.memberPct)*0.7))}));
    modelRows.push({label:'会员占比 -30%', impact:'月净利', value:fmtMoney(mp.scenes[1].profit)+' 元'});
  } else if(p.model==='community'){
    const mr = computeFin(Object.assign({},p,{traffic:Math.max(1,Math.round(num(p.traffic)*0.7))}));
    modelRows.push({label:'服务人次 -30%', impact:'月净利', value:fmtMoney(mr.scenes[1].profit)+' 元'});
  }
  return { rentUpBE:rentUp.breakEvenRev, rentDownBE:rentDown.breakEvenRev,
    profitUp:revUp.scenes[1].profit, profitDown:revDown.scenes[1].profit,
    pbUp:trUp.scenes[1].payback, pbDown:trDown.scenes[1].payback,
    baseProfit:baseProfit, deathProfit:deathProfit, death:deathProfit<=0, modelRows:modelRows };
}

   MAP_CIRCLES：圆圈颜色/大小（大/红=竞争激烈；中/橙=中等；小/绿=相对空白）

function spotColor(pressure){ return pressure>=70?'#ef4444':pressure>=55?'#f59e0b':'#22c55e'; }
function spotRadius(pressure){ return pressure>=70?16:pressure>=55?12:9; }
function levelText(v){ return v>=70?'高':v>=55?'中':'低'; }

/* 租金全链路格式：约X元/月（Y㎡，Z元/㎡/月） */
function formatRent(rent,area,unit){ return '约'+fmtMoney(rent)+'元/月（'+area+'㎡，'+unit+'元/㎡/月）'; }

  const sensRows = [
    row('租金+20% → 保本额', fmtMoney(sa.rentUpBE)+' 元'),
    row('租金-20% → 保本额', fmtMoney(sa.rentDownBE)+' 元'),
    row('客单价+15% → 月净利', fmtMoney(sa.profitUp)+' 元'),
    row('客单价-15% → 月净利', fmtMoney(sa.profitDown)+' 元'),
    row('日均单+30% → 回本', sa.pbUp),
    row('日均单-30% → 回本', sa.pbDown)
  ];
  (sa.modelRows||[]).forEach(function(mr){ sensRows.push(row(mr.label+' → '+mr.impact, mr.value)); });
  document.getElementById('finSens').innerHTML = sensRows.join('') + deathTxt;
  function row(k,v,cls){ return '<div class="r1"><span>'+k+'</span><b class="'+(cls||'')+'">'+v+'</b></div>'; }
  function sceneCard(n,sc){ const ok=sc.profit>0; return '<div class="scene '+(ok?'ok':'bad')+'"><div class="sn">'+n+'</div><div class="sp">'+fmtMoney(sc.profit)+' 元</div><div class="sn">回本 '+sc.payback+'</div></div>'; }

function dimColor(name,v){ const bh=name!=='pressure'; return bh?(v>=70?'var(--green)':v>=55?'var(--orange)':'var(--red)'):(v>=70?'var(--red)':v>=55?'var(--orange)':'var(--green)'); }
function scoreBars(d){ const s=d.scores; const rows=[{n:'供需机会',k:'supply',v:s.supply},{n:'竞争压力',k:'pressure',v:s.pressure},{n:'开店适配',k:'fit',v:s.fit}];
  return '<div class="rep-bars">'+rows.map(function(r){const col=dimColor(r.k,r.v);return '<div class="rep-bar-row"><div class="rep-bar-label">'+r.n+'</div><div class="rep-bar-track"><div class="rep-bar-fill" style="width:'+r.v+'%;background:'+col+'"></div></div><div class="rep-bar-val" style="color:'+col+'">'+r.v+'</div></div>';}).join('')+'</div>'; }

/* 评分拆解（执行摘要用）：供需/竞争/适配 各拆为 3-4 个子因子 */
function subScores(d){
  const seed = hash(d.province+d.city+d.street+d.biz);
  const cd = getCityData(d.city);
  const tp = TAG_PRESETS[d.tag]||TAG_PRESETS['居住社区'];
  const demand = clamp(Math.round(50 + cd.bias*0.6 + tp.supply*0.5 + (rnd(seed+1)-0.5)*10),22,95);
  const supplySide = clamp(Math.round(52 - tp.supply*0.5 + cd.density*7 + (rnd(seed+2)-0.5)*10),22,95);
  const external = clamp(Math.round(46 + cd.bias*0.3 + (rnd(seed+3)-0.5)*10),22,95);
  const peerDensity = clamp(Math.round(40 + cd.density*12 + tp.pressure*0.4 + (rnd(seed+4)-0.5)*10),22,95);
  const bandConc = clamp(Math.round(45 + tp.pressure*0.5 + (rnd(seed+5)-0.5)*10),22,95);
  const headShare = clamp(Math.round(42 + tp.pressure*0.45 + (rnd(seed+6)-0.5)*10),22,95);
  const rentBear = clamp(Math.round(40 + (5-cd.rentLevel)*4 + tp.fit*0.4 + (rnd(seed+7)-0.5)*8),22,95);
  const areaMatch = clamp(Math.round(45 + tp.fit*0.3 + (rnd(seed+8)-0.5)*8),22,95);
  const license = clamp(Math.round(50 + (d.fmtKey==='餐饮'?-8:d.fmtKey==='医疗'?-14:6) + (rnd(seed+9)-0.5)*8),22,95);
  const opsCx = clamp(Math.round(48 + (d.fmtKey==='餐饮'||d.fmtKey==='医疗'?6:2) + (rnd(seed+10)-0.5)*8),22,95);
  return { demand,supplySide,external,peerDensity,bandConc,headShare,rentBear,areaMatch,license,opsCx };
}
function scoreDecompHTML(d){
  const s=subScores(d);
  return '<div class="rep-callout"><b>供需机会 '+d.scores.supply+' 分</b> = 0.40×需求端('+s.demand+') + 0.35×供给端('+s.supplySide+') + 0.25×外部因子('+s.external+')。需求端衡量该街道真实消费频次与客单承载力，供给端衡量已开店密度与可进入空间，外部因子含城市规划与人口流入。</div>'+
    '<div class="rep-callout"><b>竞争压力 '+d.scores.pressure+' 分</b> = 0.40×同业密度('+s.peerDensity+') + 0.35×价格带集中度('+s.bandConc+') + 0.25×头部品牌占比('+s.headShare+')。三项越高代表红海程度越深，须用差异化或错位时段破解。</div>'+
    '<div class="rep-callout"><b>开店适配 '+d.scores.fit+' 分</b> = 0.30×租金承受力('+s.rentBear+') + 0.25×面积匹配('+s.areaMatch+') + 0.20×证照难度('+s.license+') + 0.25×运营复杂度('+s.opsCx+')。租金承受力看保本额占营收比例，面积匹配看该业态标准店型与该街道铺源吻合度。</div>';
}

    '<div class="rep-callout"><b>安全边际：</b>'+margin+'</div>'; }

function ch6(d){ return '<h2 class="rep-sec">第六章　经营策略建议</h2><ul class="rep-list">'+
    '<li><b>开业前：</b>完成选址确认清单（可见性/可达性/邻居业态）、装修侧重动线与明档、办理'+((d.fmtKey==='餐饮'||d.fmtKey==='医疗')?'食品经营/医疗类':'营业执照与卫生')+'证照、搭建 2 家以上供应链比价。</li>'+
    '<li><b>开业期：</b>试营业 2–4 周测真实客流；定价以利润款为主、引流款限时限量；首批客群通过社区团购 + 内容曝光获取，目标首月复购率 ≥25%。</li>'+
    '<li><b>稳定期：</b>会员体系锁复购（月复购 ≥3 次享权益）、线上占比控制在 15–35%、坪效考核 ≥'+Math.round(d.fin.breakEvenRev/30/d.area)+' 元/㎡/日。</li>'+
    '<li><b>关键指标监控：</b>日销 / 客单 / 复购率 / 坪效 / 人效，达标线分别为 ≥'+fmtMoney(d.fin.breakEvenRev/30)+' 元、≥'+d.fin.ticket+' 元、≥25%、覆盖月固定、人效 ≥'+fmtMoney(d.fin.labor/(d.fin.staff||1)*1.5)+' 元。</li>'+
    '<li><b>扩张信号：</b>连续 3 个月基准情景利润为正且坪效达标，周边 1 公里无同业态新增，则可考虑开二店或换大店。</li></ul>'; }

function ch7(d){ return '<h2 class="rep-sec">第七章　风险与退出条件</h2>'+riskClassification(d)+
    '<h3 class="rep-h3">退出条件与方式</h3><ul class="rep-list">'+
    '<li><b>止损线：</b>月营收连续 2 个月低于保本营业额 70%（即 <'+fmtMoney(d.fin.breakEvenRev*0.7)+' 元）→ 启动退出评估。</li>'+
    '<li><b>退出方式：</b>优先转租/转让回血，其次缩面积降固定成本，最后换业态；租约中须保留转租权与提前解约条款。</li></ul>'; }

function comparisonSection(d){
  const others=STATE.spots.filter(function(x){return x.name!==d.street;});
  const otherStreets = others.map(function(x){return x.name;});
  const otherInds=['餐饮零售','教培托管','生活服务','社区便民','便利店/茶饮快餐','其他'].filter(function(x){return x!==d.biz;});
  const hooks=[
    { axis:'同街道不同业态', items:otherInds.slice(0,3), reason:'同一条街道不同业态的客流与租金承受力差异明显，可找互补而非竞争的品类。' },
    { axis:'同区县不同街道', items:(otherStreets.length?otherStreets.slice(0,3):[d.district||d.city]), reason:'同区县不同街道的租金/客流结构不同，核心商圈贵但流量大、社区便宜但复购稳。' },
    { axis:'跨省/跨城对比', items:[ (STATE.province||'北京')+'·'+d.street, '太原·小店区·亲贤街商圈', '北京·朝阳·国贸' ], reason:'不同城市同业态的供给密度与消费力差距大，跨城对比可判断哪里更适合进入。' }
  ];
  const hookRows=hooks.map(function(h){ return '<tr><td>'+h.axis+'</td><td>'+(h.items.join(' / ')||'—')+'</td><td>'+h.reason+'</td></tr>'; }).join('');
  const priceRows=PRICING_TIERS.map(function(t){return '<tr><td>'+t.name+'</td><td>'+t.note+'</td><td class="num">'+t.price+'</td></tr>';}).join('');
  return '<h2 class="rep-sec">第八章　对比建议（正式版能力预览）</h2><div class="rep-callout">网页版仅按单街道出报告，不对全市/全省做笼统结论。以下为正式版「对比」能力预览（网页不收费）。每条对比正式版小程序支持一键对比，按次 1 元起。</div>'+
    '<table class="rep-table"><thead><tr><th>对比维度</th><th>示例（以本次选择推演）</th><th>一句话理由</th></tr></thead><tbody>'+hookRows+'</tbody></table>'+
    '<h3 class="rep-h3">正式版定价（网页不收费）</h3><table class="rep-table"><thead><tr><th>档位</th><th>说明</th><th class="num">价格</th></tr></thead><tbody>'+priceRows+'</tbody></table>'+
    '<div class="rep-tip">想对比其他街道/业态？正式版支持无限次查询 + 深度报告，按查询深度分级收费，不按省份数量线性加价。</div>'; }
function appendixHTML(d){ const w=SCORING_MODEL.weight; return '<h2 class="rep-sec">附录</h2><div class="rep-appendix">'+
  '<h3>一、数据说明</h3><p>本报告为演示版，城市档案、街道点位、财务参数均为示例数据，非真实 POI / 工商 / 客流 / 租金数据，仅用于展示产品形态与分析方法。分析细化到街道/商圈级别，不对整个省/市做笼统结论。正式版将接入高德真实数据（高德POI+工商+平台数据）。</p>'+
  '<h3>二、评分方法论</h3><p>三维度：供需机会（越高越好）、竞争压力（越高越坏）、开店适配（越高越好）。综合分 = '+(w.supply*100)+'×供需 + '+(w.pressure*100)+'×(100−竞争) + '+(w.fit*100)+'×适配。≥75 建议进入 / 60–74 谨慎进入 / &lt;60 暂不推荐。评分已避免极端值以保留对比空间。</p>'+
  '<h3>三、术语</h3><p>保本营业额 = 月固定成本 ÷ 毛利率；回本周期 = 初始投入 ÷ 月利润；供需机会 = 需求相对供给的缺口程度（示例）。租金全链路格式：月租金 = 面积 × 街道单价。</p>'+
  '<h3>四、免责声明</h3><p>'+DISCLAIMERS.foot+' 本报告为辅助决策工具，不构成投资或经营保证，不保证盈利，不替代实地调研与专业判断。</p>'+
  '</div>'; }

function buildReportData(spot){
  const tier=INDUSTRY_TIERS[STATE.biz]?INDUSTRY_TIERS[STATE.biz].tier:'T3';
  const fmtKey=PRODUCT_TO_FMT[STATE.biz]||'其他';
  const cd=getCityData(STATE.city);
  const fin=computeFin(spot.finPreset);
  const areas=STATE.spots.map(function(s){ return { name:s.name+'（'+s.tag+'）', tag:s.tag, coord:[s.coord[1],s.coord[0]], coordText:s.coord[1].toFixed(4)+'°N, '+s.coord[0].toFixed(4)+'°E', verdict:s.desc+'（示例判断，需实地核验）', scores:s.scores, finPreset:s.finPreset, rent:s.rent, area:s.area, rentUnit:s.rentUnit }; });
  return { province:STATE.province, city:STATE.city, district:STATE.district, street:spot.name, tag:spot.tag,
    biz:STATE.biz, bizLabel:FMT[fmtKey].label, tier:tier, fmtKey:fmtKey, ts:Date.now(), center:spot.coord,
    density:cd.density, rent:cd.rent, flavor:cd.flavor, audience:spot.audience, scores:spot.scores,
    fin:fin, finPreset:spot.finPreset, rent:spot.rent, area:spot.area, rentUnit:spot.rentUnit, rentRange:spot.rentRange,
    cats:spot.cats, comp:spot.comp,
    areas:areas, advices:[], risks:[], exitCond:[] };
}
function renderReport(d){
  let body=execHTML(d);
  if(d.tier!=='T3'){ body+=ch1(d)+ch2(d)+ch3(d)+ch4(d)+ch5(d)+ch6(d)+ch7(d); }
  body+=comparisonSection(d)+appendixHTML(d);
  const acts='<div class="report-acts no-print"><button class="btn print" id="printBtn">打印 / 保存 PDF</button><button class="btn ghost" id="viewLast">重新查看上次报告</button></div>';
  return '<div class="report-doc" id="report">'+metaHTML(d)+coverHTML(d)+body+acts+'</div>';
}

/* =========================================================
   REPORT_LIMIT：每用户免费生成 1 份完整报告
   ========================================================= */
const LS_REPORT_DONE='qsy_report_generated', LS_REPORT_LAST='qsy_last_report';
function generateReport(spot){
  if(lsGet(LS_REPORT_DONE)==='1'){ showAlreadyReport(); return; }
  const d=buildReportData(spot);
  paintReport(d);
  lsSet(LS_REPORT_DONE,'1'); lsSet(LS_REPORT_LAST, JSON.stringify({d:d}));
}
function paintReport(d){
  const box=document.getElementById('result');
  box.innerHTML=renderReport(d); box.classList.add('on');
  const pb=document.getElementById('printBtn'); if(pb) pb.addEventListener('click',function(){ window.print(); });
  const vl=document.getElementById('viewLast'); if(vl) vl.addEventListener('click',function(){ const last=lsGet(LS_REPORT_LAST); if(last){ try{ box.innerHTML=renderReport(JSON.parse(last).d); box.classList.add('on'); }catch(e){ toast('上次报告读取失败'); } } });
  const rep=document.getElementById('report'); if(rep&&rep.scrollIntoView) rep.scrollIntoView({behavior:'smooth',block:'start'});
}
function showAlreadyReport(){
  const box=document.getElementById('result'); const last=lsGet(LS_REPORT_LAST);
  box.innerHTML='<div class="regen">演示版已体验，正式小程序将支持真实数据+按次付费。'+(last?'<div style="margin-top:10px"><button class="btn" id="viewLast2" style="width:auto;padding:10px 18px">查看上次报告</button></div>':'')+'</div>';
  box.classList.add('on');
  const v2=document.getElementById('viewLast2'); if(v2) v2.addEventListener('click',function(){ try{ const dd=JSON.parse(last).d; const bx=document.getElementById('result'); bx.innerHTML=renderReport(dd); bx.classList.add('on'); if(document.getElementById('report')) document.getElementById('report').scrollIntoView({behavior:'smooth'}); }catch(e){ toast('上次报告读取失败'); } });
  if(box&&box.scrollIntoView) box.scrollIntoView({behavior:'smooth',block:'start'});
}

/* =========================================================
   交互：省→市→区县 下钻
   ========================================================= */
const $prov=document.getElementById('province'),$city=document.getElementById('city'),$dist=document.getElementById('district'),$biz=document.getElementById('biz'),$go=document.getElementById('go'),$load=document.getElementById('loading'),$err=document.getElementById('errCity');
function fillSelect(sel,arr,ph){ sel.innerHTML=''; if(ph){ const o=document.createElement('option'); o.value=''; o.textContent=ph; sel.appendChild(o); } arr.forEach(function(v){ const o=document.createElement('option'); o.value=v; o.textContent=v; sel.appendChild(o); }); }
function onProvince(){ const p=$prov.value; if(!p){ fillSelect($city,[],'请先选择省份'); fillSelect($dist,[],'不限定（默认首选项）'); return; } fillSelect($city,PROVINCE_CITY_MAP[p].cities,'请选择城市/城区'); onCity(); }
function onCity(){ const c=$city.value; fillSelect($dist, CITY_DISTRICT_MAP[c]||[], '不限定（默认首选项）'); }
$prov.addEventListener('change',onProvince); $city.addEventListener('change',onCity); onProvince();
$go.addEventListener('click',function(){ $load.classList.add('on'); document.getElementById('mapStage').classList.remove('on'); setTimeout(showCandidates,420); });
document.getElementById('backSel').addEventListener('click',function(){ document.getElementById('mapStage').classList.remove('on'); window.scrollTo({top:0,behavior:'smooth'}); });

function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }
let _tt=null; function toast(m){ let el=document.getElementById('__toast'); if(!el){ el=document.createElement('div'); el.id='__toast'; el.style.cssText='position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:rgba(17,24,39,.92);color:#fff;font-size:14px;padding:11px 16px;border-radius:8px;z-index:1300;opacity:0;transition:opacity .2s;pointer-events:none;text-align:center'; document.body.appendChild(el); } el.textContent=m; el.style.opacity='1'; if(_tt) clearTimeout(_tt); _tt=setTimeout(function(){ el.style.opacity='0'; },2000); }

</script>
